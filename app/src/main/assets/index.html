
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shwe Gyi Karaoke</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

#introScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: radial-gradient(circle, #34445e, #101827 75%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: opacity 1s ease;
}

#introScreen h1 {
    color: #f8d58a;
    font-size: 48px;
    margin: 10px;
    text-shadow: 0 0 20px #d99b36;
}

#introScreen p {
    color: white;
    font-size: 27px;
    margin: 10px;
}

.musicNote {
    color: #f8d58a;
    font-size: 30px;
    letter-spacing: 12px;
    animation: floatMusic 1.5s infinite alternate;
}

@keyframes floatMusic {
    from { transform: translateY(0); }
    to { transform: translateY(-12px); }
}

header {
    background: linear-gradient(135deg, #7c2d12, #b45309);
    text-align: center;
    padding: 28px 10px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
    color: #ffedd5;
    font-size: 14px;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.section {
    background: #1f2937;
    padding: 22px 16px;
    margin: 22px 0;
    border-radius: 15px;
    border: 1px solid #374151;
}

.section h2 {
    font-size: 20px;
    text-align: center;
    margin-top: 0;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 16px;
    border: 1px solid #4b5563;
    border-radius: 10px;
    background: white;
    color: #111827;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    background: #f59e0b;
    color: #111827;
    font-size: 17px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    color: #9ca3af;
    font-size: 13px;
}
</style>
</head>

<body>

<!-- Welcome Intro -->
<div id="introScreen">
    <div class="musicNote">♪ ♫ ♪</div>
    <h1>ရွှေကျီး</h1>
    <p>ဆိုမယ် ပျော်မယ်</p>
    <div class="musicNote">♫ ♪ ♫</div>
</div>

<header>
    <h1>🎤 ရွှေကျီး Karaoke</h1>
    <p>သင်ကြိုက်နှစ်သက်သော Karaoke သီချင်းများ ရှာဖွေပါ</p>
</header>

<div class="container">

    <div class="section">
        <h2>🎵 သီချင်းအမည် ရှာရန်</h2>

        <input
            type="text"
            id="songName"
            placeholder="သီချင်းအမည် ရိုက်ထည့်ပါ"
            onkeydown="if(event.key==='Enter') searchSong()"
        >

        <button type="button" onclick="searchSong()">
            🔍 သီချင်းရှာမယ်
        </button>
    </div>

    <div class="section">
        <h2>🎤 အဆိုတော်အမည် ရှာရန်</h2>

        <input
            type="text"
            id="artistName"
            placeholder="အဆိုတော်အမည် ရိုက်ထည့်ပါ"
            onkeydown="if(event.key==='Enter') searchArtist()"
        >

        <button type="button" onclick="searchArtist()">
            🔍 အဆိုတော်ရှာမယ်
        </button>
    </div>

</div>

<footer>
    Shwe Gyi Karaoke © 2026
</footer>

<script>

// Intro 5 seconds
window.addEventListener("load", function() {
    const intro = document.getElementById("introScreen");

    playIntroMusic();

    setTimeout(function() {
        intro.style.opacity = "0";

        setTimeout(function() {
            intro.style.display = "none";
        }, 1000);

    }, 5000);
});

// Soft piano-like intro melody
function playIntroMusic() {
    try {
        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContext) return;

        const audio = new AudioContext();

        audio.resume();

        const notes = [
            523.25, 659.25, 783.99,
            659.25, 587.33, 659.25
        ];

        notes.forEach(function(freq, index) {
            const start = audio.currentTime + index * 0.65;

            const oscillator = audio.createOscillator();
            const gain = audio.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = freq;

            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.12, start + 0.04);
            gain.gain.exponentialRampToValueAtTime(
                0.001, start + 0.55
            );

            oscillator.connect(gain);
            gain.connect(audio.destination);

            oscillator.start(start);
            oscillator.stop(start + 0.6);
        });

    } catch (error) {
        console.log("Intro music unavailable");
    }
}

// Search by song title
function searchSong() {
    const song = document
        .getElementById("songName")
        .value.trim();

    if (song === "") {
        alert("သီချင်းအမည် ရိုက်ထည့်ပေးပါ");
        return;
    }

    const searchText = song + " karaoke";

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(searchText);

    window.location.href = url;
}

// Search by singer name
function searchArtist() {
    const artist = document
        .getElementById("artistName")
        .value.trim();

    if (artist === "") {
        alert("အဆိုတော်အမည် ရိုက်ထည့်ပေးပါ");
        return;
    }

    const searchText = artist + " karaoke songs";

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(searchText);

    window.location.href = url;
}

</script>

</body>
</html>
